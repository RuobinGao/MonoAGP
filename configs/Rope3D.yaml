random_seed: 444


dataset:
  type: &dataset_type 'rope3d'
  root_dir: '/path/to/Rope3D/'
  train_split: 'train'
  test_split: 'val'
  batch_size: 16
  use_3d_center: False
  class_merging: False
  use_dontcare: False
  bbox2d_type: 'anno'
  meanshape: False

  # For 4-class training/evaluation,
  # set writelist to ['car', 'big_vehicle', 'pedestrian', 'cyclist']
  writelist: ['car']

  clip_2d: False
  aug_pd: True
  aug_crop: True
  random_flip: 0.5
  random_crop: 0.5
  scale: 0.05
  shift: 0.05
  depth_scale: 'normal'


# Network input resolution in [height, width].
# Explicitly reported as 512 x 960 for Rope3D.
input_resolution: [512, 960]
model_name: 'monoagp'


model:

  # Number of semantic categories represented by the classification head.
  # Rope3D uses four target classes:
  #   car
  #   big_vehicle
  #   pedestrian
  #   cyclist
  # Unlike writelist, which determines which annotated categories are
  # included in training/evaluation, num_classes determines the output
  # dimensionality of the classification head.
  num_classes: 4
  multi_bin: True
  return_intermediate_dec: True
  device: 'cuda'

  # Backbone
  backbone: 'resnet50'
  train_backbone: True
  num_feature_levels: 4
  dilation: False
  position_embedding: 'sine'
  masks: False


  # --------------------------------------------------------------
  # Depth predictor
  # --------------------------------------------------------------
  mode: LID
  num_depth_bins: 80

  depth_min: 1e-3

  # Maximum represented depth.
  # this implementation uses 180 m.
  depth_max: 180.0

  with_box_refine: True
  two_stage: False
  use_dab: False
  use_dn: False
  two_stage_dino: False
  init_box: False
  enc_layers: 3
  dec_layers: 3
  hidden_dim: 256
  dim_feedforward: 256
  dropout: 0.1
  nheads: 8
  num_queries: 50
  enc_n_points: 4
  dec_n_points: 4

  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0

  aux_loss: True

  cls_loss_coef: 2
  focal_alpha: 0.25
  bbox_loss_coef: 5
  giou_loss_coef: 2
  3dcenter_loss_coef: 10
  dim_loss_coef: 1
  angle_loss_coef: 1
  depth_loss_coef: 1
  depth_map_loss_coef: 1

  set_cost_class: 2
  set_cost_bbox: 5
  set_cost_giou: 2
  set_cost_3dcenter: 10


# ----------------------------------------------------------------
# MonoAGP geometry-related hyperparameters
# ----------------------------------------------------------------

# SLM: Spatial-adaptive Lateral Modulation
#
# alpha controls the spatial nonlinearity with respect to the
# horizontal distance from the principal point.
#
# beta controls the feature-modulation magnitude.
#
# These parameters are kept unchanged between KITTI and Rope3D.
alpha: 1.0
beta: 0.8


# ODB: Orientation-aware Dimensional Balancing
#
# lambda controls the attenuation/reweighting strength for dimension
# regression.
#
# delta controls the orientation/viewpoint tolerance threshold.
#
# These parameters are also kept unchanged across datasets.
lambda: 0.8
delta: 0.6


# ----------------------------------------------------------------
# DPP: Depth-adaptive Progressive Partitioning
# ----------------------------------------------------------------
# MonoAGP uses an N/2 -> N progressive depth-partitioning strategy.
# The manuscript reports the optimal Rope3D threshold as 1.0.
dpp_threshold: 1.0


# ----------------------------------------------------------------
# Optimizer
# ----------------------------------------------------------------

optimizer:
  type: 'adamw'
  lr: 0.00125
  weight_decay: 0.0001


# ----------------------------------------------------------------
# Learning-rate scheduler
# ----------------------------------------------------------------

lr_scheduler:
  type: 'step'
  warmup: True
  decay_rate: 0.1
  decay_list: [90, 125]


# ----------------------------------------------------------------
# Training
# ----------------------------------------------------------------

trainer:

  # Total number of training epochs.
  # Explicitly reported as 150 for Rope3D.
  max_epoch: 150
  gpu_ids: '0'
  save_frequency: 1
  # resume_model: True
  # pretrain_model: path/to/ckpt

  save_path: '/path/to/output/rope3d'
  save_all: False
  use_dn: False
  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0

tester:
  type: *dataset_type
  mode: single
  checkpoint: 150
  threshold: 0.1
  topk: 50
