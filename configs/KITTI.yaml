random_seed: 444

dataset:
  type: &dataset_type 'KITTI'
  root_dir: '/path/to/KITTI/'
  train_split: 'train'
  test_split: 'val'
  batch_size: 16
  use_3d_center: True
  class_merging: False
  use_dontcare: False
  bbox2d_type: 'anno'  # 'proj' or 'anno'
  meanshape: False

  # For three-class training/evaluation,
  # set writelist to ['Car', 'Pedestrian', 'Cyclist']
  writelist: ['Car']
  clip_2d: False

  aug_pd: True
  aug_crop: True

  random_flip: 0.5
  random_crop: 0.5
  scale: 0.05
  shift: 0.05

  depth_scale: 'normal'

input_resolution: [384, 1280]

model_name: 'monoagp'

model:
  # KITTI uses a fixed three-class label space:
  # Pedestrian = 0, Car = 1, Cyclist = 2.
  # The writelist filters target categories without remapping their class IDs;
  # therefore, the classification head retains all three output classes.
  num_classes: 3
  return_intermediate_dec: True
  device: 'cuda'

   # Backbone
  backbone: 'resnet50'
  train_backbone: True
  num_feature_levels: 4
  dilation: False
  position_embedding: 'sine'
  masks: False

  # Depth predictor
  mode: LID
  num_depth_bins: 80
  depth_min: 1e-3
  depth_max: 60.0

  with_box_refine: True
  two_stage: False
  use_dab: False
  use_dn: False
  two_stage_dino: False
  init_box: False
  enc_layers: 3
  dec_layers: 3
  hidden_dim: 256
  dim_feedforward: 256
  dropout: 0.1
  nheads: 8
  num_queries: 50
  enc_n_points: 4
  dec_n_points: 4

  # DN
  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0

  # Loss
  aux_loss: True

  # Loss coefficients
  cls_loss_coef: 2
  focal_alpha: 0.25
  bbox_loss_coef: 5
  giou_loss_coef: 2
  3dcenter_loss_coef: 10
  dim_loss_coef: 1
  angle_loss_coef: 1
  depth_loss_coef: 1
  depth_map_loss_coef: 1

  # Matcher
  set_cost_class: 2
  set_cost_bbox: 5
  set_cost_giou: 2
  set_cost_3dcenter: 10

# ----------------------------------------------------------------
# MonoAGP geometry-related hyperparameters
# ----------------------------------------------------------------

# SLM: Spatial-adaptive Lateral Modulation
#
# alpha controls the nonlinear relationship between modulation strength
# and the horizontal displacement from the principal point.
#
# beta controls the overall modulation magnitude.
#
# According to the KITTI ablation study in the manuscript:
#   alpha = 1.0
#   beta  = 0.8
alpha: 1.0
beta: 0.8

# ODB: Orientation-aware Dimensional Balancing
#
# lambda is the attenuation/reweighting coefficient used to balance
# dimension regression according to object observability.
#
# delta is the viewpoint/orientation tolerance threshold controlling
# when dimension-specific balancing is applied.
#
# According to the KITTI ablation study:
#   lambda = 0.8
#   delta  = 0.6
lambda: 0.8
delta: 0.6

# ----------------------------------------------------------------
# DPP: Depth-adaptive Progressive Partitioning
# ----------------------------------------------------------------

# MonoAGP adopts an N/2 -> N progressive depth-partitioning strategy:
#
#   Stage 1: use N/2 coarse depth intervals
#   Stage 2: progressively switch to all N depth intervals
#
# The transition is controlled by the stability of the depth-loss curve.
#
# The optimal switching threshold reported for KITTI is 0.5.
#
# NOTE:
# The N/2 -> N schedule itself is implemented in the DPP module;
# this YAML parameter specifies the dataset-dependent switching threshold.
dpp_threshold: 0.5

optimizer:
  type: 'adamw'
  lr: 0.0002
  weight_decay: 0.0001

lr_scheduler:
  type: 'step'
  warmup: False
  decay_rate: 0.1

  decay_list: [90,125]

trainer:
  max_epoch: 155
  gpu_ids: '0'
  save_frequency: 1
  # resume_model: True
  # pretrain_model: path/to/ckpt
  save_path: 'outputs/'
  save_all: False
  use_dn: False
  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0

tester:
  type: *dataset_type
  mode: single
  checkpoint: 155
  threshold: 0.2
  topk: 50
